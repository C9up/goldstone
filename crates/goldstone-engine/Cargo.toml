[package]
name = "goldstone-engine"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Parses received mail as hostile input, for Goldstone"

[dependencies]
# MIME parsing. Fuzzed, iterative, with its own bounds on parts and nesting
# and searches that do not rescan the message for a missing boundary.
# Pinned: structure.rs bounds what this release builds (see its header) and
# the bounds were measured against it; an upgrade is measured again.
mail-parser = "=1.0.1"
# HTML sanitizing for display — the library blackhole-engine already uses.
ammonia = "4"
# The parser under ammonia, run once on its own to measure the tree before
# ammonia builds it (see html.rs).
html5ever = "0.40"
# DKIM, SPF, DMARC and ARC. On the pure-Rust RustCrypto backend rather than
# the default aws-lc-rs, a C library that is heavy to cross-compile for five
# platforms (mail-auth 0.14 dropped the ring backend this used before).
mail-auth = { version = "0.15", default-features = false, features = ["rust-crypto", "dns-hickory", "arc"] }
# A domain's A-label, the form DMARC compares (mail-auth keeps its own
# conversion private). Already in the tree through mail-auth.
idna = "1"
# The deadline on the DNS checks, and block_in_place for the parse.
tokio = { version = "1", features = ["time", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Signing test messages with a key the test publishes in the cache.
mail-auth = { version = "0.15", default-features = false, features = ["rust-crypto", "dns-hickory", "arc", "generate"] }
