# What `cargo audit --deny warnings` may pass over in goldstone, and why.
#
# CI runs `cargo audit --deny warnings` from this directory, so every
# advisory fails the release, unmaintained and unsound ones included, unless
# it is listed here. An entry is a claim that has to stay checkable: say why it
# cannot be removed today and what upstream release lets it go.

[advisories]
ignore = [
  # RUSTSEC-2023-0071: rsa 0.9, the Marvin attack, a timing side channel in
  # the PRIVATE-key operation (decryption, signing). It ships in the binary
  # through mail-auth's rust-crypto backend (mail-auth 0.14 dropped ring), and
  # goldstone only verifies DKIM/ARC signatures with it, a public-key
  # operation the attack does not reach; signing happens in the tests alone.
  # rsa 0.10 has the constant-time rewrite, but mail-auth 0.15.1 requires
  # rsa ^0.9.8.
  # DROP WHEN mail-auth moves to rsa 0.10, or when goldstone stops depending
  # on rsa.
  "RUSTSEC-2023-0071",
]
